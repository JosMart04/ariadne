# The prologue: the last night of Knossos Station. It plants the mystery and hands over the thread.
# Set: src/scenes/telescope, the same console the finale uses, so the ending is seeded here (requirements 5.3).
# The camera looks at the telescope, never at what it points at: nobody knows yet who answers.
# No radio is tuned here on purpose: 88 rival projects use that mechanic.
id: prologue
title: The Last Night

set:
  scene: telescope
  labels: [artistic-view]

console:
  name: Station telescope
  controls:
    laser:
      label: Laser
      tag: IMAGINED
      does: Sends one pulse of light into the sky. Knossos Station and its nightly pulse are fiction.

beats:
  - kind: lines
    cue: console
    lines:
      - { who: ariadne, tag: IMAGINED, text: "Good evening, Operator. You're the last one. They're shutting us down at dawn." }
      - { who: note, tag: IMAGINED, text: "Every night at midnight, something answers. I never found out who. — R." }

  - kind: puzzle
    cue: console
    title: The midnight pulse
    puzzle:
      archetype: [A]
      initial: listen
      maxSteps: 4
      hints:
        - The old operators did the same thing every night.
        - Send one pulse of light, then wait.
      states:
        listen:
          stage: { kind: scene, cue: console }
          prompt: How do you want to listen?
          choices:
            - { label: Put on headphones, to: ready }
            - { label: Read captions, to: ready }
        ready:
          stage: { kind: scene, cue: console }
          say: "The telescope still holds its old coordinates. Nobody remembers what it points at."
          prompt: It is midnight.
          choices:
            - { label: Send the pulse, detail: "One flash of laser light.", to: sent }
            - { label: Read the note again, to: note }
        note:
          stage: { kind: scene, cue: console }
          say: "\"Every night at midnight, something answers.\" The note is old. The pulse has never missed a night."
          next: ready
        sent:
          stage: { kind: scene, cue: pulse-blind }
          say: "The pulse leaves. Two and a half seconds of silence. Then the lamp lights: something has answered, with an exact copy."
          next: SOLVED

  - kind: clew
    cue: pulse-blind
    clew:
      id: clew-0
      title: Exact copy
      line: "The answer has exactly the same shape as the pulse we sent."
      teaches: Whatever answers sends back a perfect copy of our own signal.
      rulesOut: A transmitter with a message of its own.

  - kind: lines
    cue: console
    lines:
      - { who: ariadne, tag: IMAGINED, text: "My memory is damaged. But the old machines remember. If we restore them, maybe they'll tell us." }
      - { who: ariadne, tag: IMAGINED, text: "Hold this. It is a thread. In a labyrinth, a thread is how you find your way back." }
