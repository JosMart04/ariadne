ar.task: Look for
ar.showme: Show me
ar.memory: "Open the memory of {name}"
ar.back: Back to the labyrinth
ar.credit: "3D and AR viewer: model-viewer by Google, Apache License 2.0. The AR models are NASA's, resized to their real size."
ar.ingenuity.alt: "The Ingenuity helicopter: a small box on four thin legs, two rotors one above the other, and a solar panel on top."
ar.ingenuity.size: "Real size: its rotors measure 1.2 meters from tip to tip. This model stands {h} meters tall."
ar.ingenuity.task: The solar panel. Where is it, and what did it do?
ar.ingenuity.answer: "It sits on top, above both rotors. NASA: the solar panel charged the batteries with enough energy for one 90-second flight per Martian day."
ar.opportunity.alt: "The Opportunity rover: a flat deck of solar panels on six wheels, with a camera mast standing at the front. A simplified NASA model, without fine detail."
ar.opportunity.size: "Real size: {w} meters wide. This is a simplified model: its camera mast stands {h} meters, and NASA gives 1.5."
ar.opportunity.task: The camera mast. How high were its cameras?
ar.opportunity.answer: "NASA: the mast-mounted cameras were about 1.5 meters off the ground, to see the terrain all around. In this simplified model the mast is lower, {h} meters."
