name: Lunar Roving Vehicles
title: The Last Drive
slate: { place: "Hadley, Descartes, Taurus-Littrow", year: 1971 }
launched: "1971-07-26"
draft: true
status: { badge: parked, where: "Three Apollo landing sites, the Moon" }
