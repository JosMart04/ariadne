facts:
  ice:
    text: Bright chunks in Phoenix's trench vanished within four days, so they had to be water ice, not salt.
    source: https://www.jpl.nasa.gov/news/bright-chunks-at-phoenix-landers-mars-site-must-have-been-ice
  last-contact:
    text: Phoenix last communicated on Nov. 2, 2008. Orbital images later showed ice damage to a solar panel.
    source: https://space.com/8477-nasa-declares-mars-lander-broken-dead.html
    note: Secondary source. Look for the NASA/JPL release.
  snow:
    text: Phoenix observed snow falling from Martian clouds.
    source: https://science.nasa.gov/mission/phoenix/
    note: VERIFY (LIDAR observation, 2008 release).

