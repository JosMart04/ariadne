id: e02-apollo11
num: 2
act: moon
name: Apollo 11 "Eagle"
title: Magnificent Desolation
slate: { place: Tranquility Base, year: 1969 }
launched: "1969-07-16"
key: true
status: { badge: silent-intact, where: "Sea of Tranquility, the Moon" }
