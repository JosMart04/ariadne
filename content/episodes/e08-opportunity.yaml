# E08 Opportunity: the rover that lived on sunlight. Key episode of the Thread: it awards clew II.
# Set: src/scenes/meridiani (cues and hotspots in its cues.json). Simulation: src/sim/meridiani.ts.
# Operated the way it really was: planned from Earth, one sequence per sol, minutes of delay. No joystick.
# Every fact below was read against its source on Nov 15, 2026 (see `note`). `verified:` is for HUMAN initials only.
id: e08-opportunity
num: 8
act: mars
name: Opportunity
title: Chasing the Sun
slate: { place: Meridiani Planum, year: 2004 }
launched: "2003-07-07"
key: true
status: { badge: silent-buried, where: "Perseverance Valley, Mars" }
nssdca: [2003-032A]
resource: spirit-opportunity

objectives:
  - Explain how a team on Earth operated a rover on Mars without driving it in real time.
  - Explain why a solar-powered rover depends on slopes, dust and weather.
  - Say where Opportunity is today and why it went silent.

