# Facts checked against the linked NASA/JPL pages on November 15, 2026. Human signatures remain separate.
id: e11-ingenuity
num: 11
act: mars
name: Ingenuity
title: Thin Air
slate: { place: Jezero Crater, year: 2021 }
launched: "2020-07-30"
status: { badge: grounded, where: "Valinor Hills, Jezero Crater, Mars" }
nssdca: [2020-052A]
resource: ingenuity

objectives:
  - Explain how a small helicopter flew without a pilot on Mars.
  - Compare the planned five flights with the completed 72.
  - Distinguish the end of flight from the plan to store data.

facts:
  flights:
    text: Ingenuity launched on July 30, 2020. Planned for five test flights, it completed 72 and became a scout for Perseverance.
    source: https://science.nasa.gov/mission/mars-2020-perseverance/ingenuity-mars-helicopter/
    note: "Checked Nov 15, 2026: Key Facts gives the launch date; The Legacy of Ingenuity describes five planned tests, 72 completed flights, and aerial scouting."
  build:
    text: Ingenuity has a mass of 1.8 kilograms. Its rotors span about 1.2 meters, and it flew in Mars's extremely thin atmosphere.
    source: https://science.nasa.gov/mission/mars-2020-perseverance/ingenuity-mars-helicopter/
    note: "Checked Nov 15, 2026: Tech Specs lists mass 1.8 kg and rotor length about 1.2 m; 5 Things to Know describes flight in thin air."
  power:
    text: A solar array charged six batteries. Stored energy powered the flight and heaters for cold Martian nights.
    source: https://www.jpl.nasa.gov/news/press_kits/mars_2020/ingenuity/landing/mission/spacecraft/
    note: "Checked Nov 15, 2026: Power describes six lithium-ion batteries recharged daily by the solar array, supplying heaters and flight operations."
  relay:
    text: Commands reached Ingenuity through Perseverance. The rover's base station stored the helicopter's transmissions and sent them toward Earth.
    source: https://www.jpl.nasa.gov/news/press_kits/mars_2020/ingenuity/landing/mission/spacecraft/
    note: "Checked Nov 15, 2026: Telecommunications describes the Deep Space Network, optional orbiter relay, rover computer, helicopter base station and return path."
  first-flight:
    text: Ingenuity made the first powered, controlled flight on another planet on April 19, 2021. Onboard systems flew it autonomously.
    source: https://www.nasa.gov/news-release/nasas-ingenuity-mars-helicopter-succeeds-in-historic-first-flight/
    note: "Checked Nov 15, 2026: The release records the first flight and says onboard guidance, navigation and control flew it; Earth could not use a joystick."
  flight72:
    text: Rotor damage during the January 18, 2024 landing ended Ingenuity's ability to fly. NASA announced the mission's end on January 25.
    source: https://www.nasa.gov/news-release/after-three-years-on-mars-nasas-ingenuity-helicopter-mission-ends/
    note: "Checked Nov 15, 2026: The Jan. 25 release says imagery of the Jan. 18 landing showed rotor damage and the helicopter could no longer fly."
  storing-data:
    text: Ingenuity rests at Valinor Hills. In April 2024, engineers confirmed software for collecting and storing data after the rover moved beyond radio range.
    source: https://www.jpl.nasa.gov/news/nasas-ingenuity-mars-helicopter-team-says-goodbye-for-now/
    note: "Checked Nov 15, 2026: The April 16 report places Ingenuity at Valinor Hills and confirms the update. Bytes and Cake describes daily equipment checks, images and temperatures; it does not establish present operation."

arrival:
  - { who: machine, tag: IMAGINED, text: "You came looking for wheels. Look a little higher." }
  - { who: ariadne, tag: REAL, fact: build, text: "You meet a helicopter with a mass of 1.8 kilograms. Its rotors stretch about 1.2 meters across." }
  - { who: ariadne, tag: REAL, fact: first-flight, text: "On April 19, 2021, it made the first powered, controlled flight on another planet." }

operation:
  title: Fly without a pilot
  explainer:
    - { text: "You begin with sunlight. A solar array charges batteries for flight and for heaters during the cold night.", fact: power }
    - { text: "You send commands through Perseverance. Its base station passes them to the helicopter.", fact: relay }
    - { text: "During flight, onboard systems guide the helicopter. You cannot fly it from Earth with a live joystick.", fact: first-flight }
    - { text: "You wait for the record. Perseverance stores the helicopter's transmissions and passes the data toward Earth.", fact: relay }

discovery:
  headline:
    text: "Five planned flights became 72. A flight experiment became a scout."
    fact: flights
  story:
    text: >-
      You see a new way to explore Mars.
      Ingenuity proved that powered, controlled flight could work on another planet.
      The plan called for five test flights.
      The helicopter completed 72 and helped scout places for Perseverance.
      You can trace that change from a first experiment to a useful view from above.
    facts: [first-flight, flights]

silence:
  before:
    - { who: ariadne, tag: REAL, fact: flight72, text: "The last landing damaged the rotors on January 18, 2024. Ingenuity could no longer fly." }
    - { who: machine, tag: IMAGINED, text: "Keep the sky in your memory. I will keep this patch of ground." }
  last:
    who: record
    tag: REAL
    fact: storing-data
    text: "In April 2024, engineers confirmed a new role: collect and store data after the rover moves beyond radio range."

statusNow:
  text: "Ingenuity rests at Valinor Hills. Its final software was designed to store data locally. You are reading a mission record, not live telemetry."
  fact: storing-data

# Epigraph checked in Poems, Second Series (1891), Life VI, Hope:
# https://www.gutenberg.org/files/12242/12242-h/12242-h.htm
# The early printed edition has no quotation marks around Hope.
epigraph:
  text: "Hope is the thing with feathers"
  author: Emily Dickinson
  work: Poems, Second Series
  year: 1891

