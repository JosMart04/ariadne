facts:
  landing:
    text: Spirit landed in Gusev Crater on Jan. 4, 2004.
    source: https://science.nasa.gov/mission/mars-exploration-rovers-spirit-and-opportunity/
  silica:
    text: Dragging its broken wheel, Spirit scraped up nearly pure silica near Home Plate, evidence of past hot springs or steam vents.
    source: https://www.jpl.nasa.gov/news/nasas-spirit-rover-completes-mission-on-mars
  troy:
    text: Spirit became stuck at "Troy" in 2009. Its last communication was on March 22, 2010.
    source: https://www.jpl.nasa.gov/news/nasas-spirit-rover-completes-mission-on-mars

