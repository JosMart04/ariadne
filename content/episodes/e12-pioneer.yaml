  aldebaran:
    text: Pioneer 10 is heading in the general direction of the star Aldebaran in Taurus, a journey of more than 2 million years.
    source: https://nssdc.gsfc.nasa.gov/planetary/text/pion10_pr_20030225.txt
    note: VERIFY wording against the 2003 release.
  plaque:
    text: Both Pioneers carry a plaque showing where and when they came from.
    source: https://science.nasa.gov/mission/pioneer-10/

