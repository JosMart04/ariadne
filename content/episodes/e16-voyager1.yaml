clew:
  id: clew-3
  title: Distance is time
  line: "A signal's delay tells you how far it went. A day to Voyager. Minutes to Mars. And 2.5 seconds, there and back, to something much closer."
  teaches: The time a signal takes measures the distance it travelled.
  rulesOut: That the answer at midnight comes from far away.

