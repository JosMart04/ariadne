facts:
  farthest:
    text: No spacecraft has gone farther than Voyager 1. It was launched on Sept. 5, 1977, and crossed into interstellar space in August 2012.
    source: https://science.nasa.gov/mission/voyager/voyager-1/
    note: "Checked: 'No spacecraft has gone farther than NASA's Voyager 1. Launched in 1977 ... crossed into interstellar space in August 2012 and continues to collect data.' and 'launch Sept. 5, 1977'."
  heliosphere:
    text: Voyager 1 and Voyager 2 are the only spacecraft that have ever worked outside the heliosphere, the bubble of particles and magnetic fields that the Sun makes around itself.
    source: https://science.nasa.gov/mission/voyager/
    note: "Checked: 'the only spacecraft ever to operate outside the heliosphere, the protective bubble of particles and magnetic fields generated by the Sun.'"
  light-day:
    text: On Nov. 18, 2026, Voyager 1 is 25.9 billion km from Earth. That is the distance light travels in 24 hours, called one light-day. It is the first human-made object to get that far.
    source: https://science.nasa.gov/mission/voyager/where-are-voyager-1-and-voyager-2-now/
    note: "Checked: '16.094 billion miles (25.902 billion kilometers) away from Earth — or, the distance light travels in 24 hours, also known as one light-day. Voyager 1 will be the first human-made object to reach this distance'. The page's countdown targets 2026-11-18T10:16 UTC."
  dishes:
    text: Each site of NASA's Deep Space Network has one huge antenna, 70 meters wide. They are its largest and most sensitive antennas, able to track a spacecraft tens of billions of miles from Earth.
    source: https://www.nasa.gov/directorates/somd/space-communications-navigation-program/what-is-the-deep-space-network/
    note: "Checked: 'Each Deep Space Network site has one huge, 230-foot (70-meter) diameter antenna. The 70-meter antennas are the largest and most sensitive DSN antennas, capable of tracking a spacecraft traveling tens of billions of miles from Earth.'"
  three-sites:
    text: The Deep Space Network has three sites, in California, Spain and Australia, about 120 degrees apart around the world. As the Earth turns, one of them can always hear a distant spacecraft.
    source: https://www.nasa.gov/directorates/somd/space-communications-navigation-program/what-is-the-deep-space-network/
    note: "Checked: 'three facilities ... approximately 120 degrees apart in longitude ... Goldstone, near Barstow, California; near Madrid, Spain; and near Canberra, Australia ... permits constant communication with spacecraft as our planet rotates'."
  chip:
    text: In November 2023 Voyager 1 began to send data nobody could read. One chip had failed in the computer that packages its data, and part of that computer's code was lost.
    source: https://science.nasa.gov/blogs/voyager/2024/04/22/nasas-voyager-1-resumes-sending-engineering-updates-to-earth/
    note: "Checked: 'For the first time since November'; 'flight data subsystem (FDS) ... responsible for packaging the science and engineering data'; 'a single chip responsible for storing a portion of the FDS memory — including some of the FDS computer's software code — isn't working.'"
  moved-code:
    text: The team could not repair the chip. They moved the lost code to other places in the computer's memory, piece by piece. The first piece was sent on April 18, 2024.
    source: https://science.nasa.gov/blogs/voyager/2024/04/22/nasas-voyager-1-resumes-sending-engineering-updates-to-earth/
    note: "Checked: 'Unable to repair the chip, the team decided t[o place the affected code elsewhere]' and 'They sent it to its new location in the FDS memory on April 18.' VERIFY by hand the words between the two fragments."
  round-trip:
    text: In 2024 a radio signal needed about 22 and a half hours to reach Voyager 1, and as long again to come back. On April 20 the team saw that the fix had worked.
    source: https://science.nasa.gov/blogs/voyager/2024/04/22/nasas-voyager-1-resumes-sending-engineering-updates-to-earth/
    note: "Checked: 'A radio signal takes about 22 ½ hours ...' and the photo caption dated April 20 (the team celebrating readable data). VERIFY the full sentence by hand."
  portrait:
    text: Voyager 1's last 64 images were a family portrait of the solar system, taken from 40 times the Earth's distance from the Sun. Six planets are in it. The picture of the Earth is known as the Pale Blue Dot.
    source: https://science.nasa.gov/mission/voyager/voyager-1/
    note: "Checked: 'Voyager 1's final 64 images were a mosaic taken at a distance of 40 Astronomical Units (AU) from the Sun. This solar system family portrait included six planets ... The image of Earth inspired the Pale Blue Dot'. No text by Carl Sagan is quoted anywhere in the game."

