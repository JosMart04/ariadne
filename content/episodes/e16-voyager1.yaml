operation:
  title: The Glitch
  explainer:
    - text: Nobody steers Voyager 1. Operators point a giant antenna on Earth at the place where it should be.
      fact: dishes
    - text: In November 2023 its data stopped making sense. A single chip had failed.
      fact: chip
    - text: The team could not touch the chip, so they moved the lost code to other parts of the memory.
      fact: moved-code
    - text: Every message needed almost a day to arrive, and almost a day to be answered.
      fact: round-trip
  puzzle:
    archetype: [F, I]
    initial: point
    maxSteps: 8
    hints:
      - Nothing here happens fast. Count the hours.
      - A signal needs the same time to go and to come back.
    states:
      point:
        stage: { kind: scene, cue: aim }
        say: "November 2023. Voyager 1 is calling, but its data makes no sense. First you have to hear it."
        prompt: Where do you point the dish?
        sim: dsn
        hints:
          - Voyager 1 is far too faint to see. Trust the predicted numbers.
          - The gold ring marks the predicted position.
        choices:
          - { label: The bright planet, detail: "Easy to see.", to: planet, when: on-planet, target: planet }
          - { label: The predicted position, detail: "Nothing to see there. Only numbers.", to: heard, when: on-voyager, target: voyager }
          - { label: Empty sky, detail: "High in the west.", to: nothing, when: on-empty, target: empty }
      planet:
        wrong: true
        stage: { kind: scene, cue: listen }
        say: "A planet shines, but it does not speak on Voyager's frequency. The dish hears only noise."
        next: point
      nothing:
        wrong: true
        stage: { kind: scene, cue: listen }
        say: "Noise. A dish this size hears only a tiny patch of sky. It must point almost exactly at the spacecraft."
        next: point
      heard:
        stage: { kind: scene, cue: listen }
        fact: chip
        say: "There it is: a whisper that left Voyager almost a day ago. But the data is garbage. One chip has failed in the computer that packages it."
        prompt: The chip is 24 billion kilometers away. What do you do?
        choices:
          - { label: Send someone to repair it, to: no-repair }
          - { label: Move the lost code to other memory, detail: "Piece by piece, by radio.", to: sent }
          - { label: Switch that computer off, to: no-off }
      no-repair:
        wrong: true
        stage: { kind: scene, cue: voyager }
        fact: moved-code
        say: "Nobody can reach it, and nobody ever will. The team could not repair the chip. They had to work around it."
        next: heard
      no-off:
        wrong: true
        stage: { kind: scene, cue: voyager }
        fact: chip
        say: "That computer packages every piece of data Voyager sends. Without it, there is nothing to hear."
        next: heard
      sent:
        stage: { kind: scene, cue: dish }
        fact: moved-code
        say: "The team cuts the lost code into pieces and gives each one a new home in the memory. On April 18, 2024, the first piece leaves the dish."
        prompt: When will you know if it worked?
        choices:
          - { label: In a few seconds, to: too-soon }
          - { label: In about 22 hours, to: one-way }
          - { label: In about 45 hours, to: answered }
      too-soon:
        wrong: true
        stage: { kind: scene, cue: passage }
        say: "Light from the Moon comes back in 2.5 seconds. Voyager 1 is sixty thousand times farther away."
        next: sent
      one-way:
        wrong: true
        stage: { kind: scene, cue: passage }
        fact: round-trip
        say: "That is only the way out. The command needs about 22 and a half hours to arrive. The answer needs as long to come home."
        next: sent
      answered:
        forced: true
        stage: { kind: scene, cue: voyager }
        fact: round-trip
        say: "April 20, 2024. Two days after the command left, the answer arrives. The data is readable again. Voyager 1 is back."
        next: SOLVED

discovery:
  headline:
    text: "November 18, 2026: Voyager 1 is one light-day from Earth. A hello sent tonight arrives tomorrow."
    fact: light-day
  story:
    text: >-
      Voyager 1 was built to visit Jupiter and Saturn. It did, and then it kept going.
      In 2012 it left the bubble of particles that the Sun blows around its planets, and entered the space between the stars.
      It is still flying, and still reporting what that space is like.
      We hear it with three stations spread around the world, so that one of them always faces it as the Earth turns.
      Its signal is so faint that only the largest antennas can catch it.
      And it is so far away that the distance is easier to say in time: one day, at the speed of light.
    facts: [farthest, heliosphere, three-sites, dishes, light-day]
    cues: [voyager, passage, voyager, dish, dish, portrait]

