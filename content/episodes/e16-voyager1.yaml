facts:
  light-day:
    text: Voyager 1 reaches one light-day from Earth in November 2026, about 25.9 billion km away. A command then takes a full day to arrive.
    source: https://earthsky.org/space/voyager-1-1-light-day-from-earth-november-17-18-2026/
    note: Secondary source. Prefer a NASA/JPL release. The game computes the live distance itself.
  lecp-off:
    text: In April 2026 NASA switched off the LECP instrument to save power. Two science instruments remain on.
    source: https://www.skyatnightmagazine.com/news/voyager-1-low-energy-charged-particles-experiment-shut-down
    note: Secondary source. Prefer a NASA/JPL release.
  interstellar:
    text: Voyager 1 entered interstellar space in 2012.
    source: https://science.nasa.gov/mission/voyager/

