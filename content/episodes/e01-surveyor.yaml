id: e01-surveyor
num: 1
act: moon
name: Surveyor 1 & 3
title: The Scouts
slate: { place: Oceanus Procellarum, year: 1966 }
launched: "1966-05-30"
status: { badge: silent-intact, where: "Ocean of Storms, the Moon" }
nssdca: [1966-045A, 1967-035A]
resource: surveyor
objectives:
  - Explain how radar guided a robotic lunar landing.
  - Describe how cameras and soil tests prepared later landings.
  - Connect Surveyor 3 with the Apollo 12 visit.
facts:
  first-landing:
    text: Surveyor 1 launched on May 30, 1966, and made the first US soft landing on the Moon on June 2.
    source: https://nssdc.gsfc.nasa.gov/planetary/lunar/surveyor.html
    note: "Checked Nov 15, 2026: The overview identifies the first US safe landings; the Surveyor 1 row gives launch and landing dates."
  radar:
    text: Surveyor 1 used radar measurements of its speed to guide the descent. Its computer adjusted the landing engines.
    source: https://science.nasa.gov/mission/surveyor-1/
    note: "Checked Nov 15, 2026: In Depth describes Doppler velocity measurements feeding the descent computer and controllable vernier propulsion."
  feet:
    text: Sensors in Surveyor 1's landing legs recorded the forces of touchdown. Photographs showed the nearby lunar ground.
    source: https://science.nasa.gov/mission/surveyor-1/
    note: "Checked Nov 15, 2026: The spacecraft description lists shock absorbers, strain gauges for landing characteristics and the television camera."
  surveyor3:
    text: Surveyor 3 landed in the Ocean of Storms on April 20, 1967. Its soil sampler dug trenches and tested the ground's strength.
    source: https://science.nasa.gov/mission/surveyor-3/
    note: "Checked Nov 15, 2026: Key Dates gives April 20; In Depth describes remotely commanded trenching, bearing tests and impact tests."
  ground:
    text: Surveyor 3's tests showed that the soil could support an Apollo lunar module. Its camera and sampler helped assess the landing surface.
    source: https://science.nasa.gov/mission/surveyor-3/
    note: "Checked Nov 15, 2026: The results paragraph says the soil strength was consistent with the lunar module's requirements."
  contact-one:
    text: Surveyor 1's last contact was January 7, 1967.
    source: https://science.nasa.gov/mission/surveyor-1/
    note: "Checked Nov 15, 2026: In Depth gives January 7, 1967 as last contact."
  contact-three:
    text: Surveyor 3's final transmissions came on May 4, 1967.
    source: https://science.nasa.gov/mission/surveyor-3/
    note: "Checked Nov 15, 2026: In Depth gives May 4, 1967 as the end of transmissions before lunar night."
  apollo12-visit:
    text: In November 1969, Apollo 12 astronauts visited Surveyor 3. They returned its camera and soil scoop to Earth for study.
    source: https://science.nasa.gov/mission/surveyor-3/
    note: "Checked Nov 15, 2026: The closing paragraphs describe the November 1969 visit and returned camera and scoop. Exact distance and day are omitted."
arrival:
  - { who: machine, tag: IMAGINED, text: "Before you take a step, you want to know what will hold you." }
  - { who: ariadne, tag: REAL, fact: first-landing, text: "You reach the Moon with Surveyor 1 on June 2, 1966. It is the first US soft landing there." }
operation:
  title: Test the ground before a crew arrives
  explainer:
    - { text: "You measure descent speed with radar. The computer uses those readings to control the landing engines.", fact: radar }
    - { text: "At touchdown, sensors in the landing legs record forces. You inspect photographs of the ground around the spacecraft.", fact: feet }
    - { text: "With Surveyor 3, you send commands to a soil sampler. It digs trenches and presses into the ground.", fact: surveyor3 }
    - { text: "You compare the soil's measured strength with the needs of an Apollo lunar module.", fact: ground }
discovery:
  headline: { text: "Surveyor 3's soil tests supported plans for an Apollo landing.", fact: ground }
  story:
    text: >-
      You need more than a distant view of the Moon.
      Surveyor 3 tests the ground directly and photographs the surface.
      The results show soil strong enough to support an Apollo lunar module.
      In November 1969, Apollo 12 astronauts visit the spacecraft and return parts to Earth.
    facts: [surveyor3, ground, apollo12-visit]
silence:
  before:
    - { who: ariadne, tag: REAL, fact: contact-one, text: "Surveyor 1's last contact comes on January 7, 1967." }
    - { who: ariadne, tag: REAL, fact: contact-three, text: "Surveyor 3 sends its final transmissions on May 4 that year." }
    - { who: ariadne, tag: REAL, fact: apollo12-visit, text: "You can study Surveyor 3 again through its returned camera and scoop, brought home by Apollo 12." }
  last: { who: machine, tag: IMAGINED, text: "You brought your question back as a footprint." }
statusNow:
  text: "The Surveyors remain at their lunar landing sites. Surveyor 3's camera and soil scoop were returned to Earth by Apollo 12."
  fact: apollo12-visit
