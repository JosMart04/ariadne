    text: Dust on its solar panels ended the mission in December 2022.
    source: https://spaceflightnow.com/2022/12/21/nasas-insight-lander-bows-out-after-ground-shaking-mars-mission/
    note: Secondary source. Look for the NASA/JPL release.

